name: public-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-python312:
    name: Linux / Python 3.12 / unit and syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check paramiko
      - name: Record environment
        run: |
          uname -a
          python --version
          git rev-parse HEAD
      - name: Shell syntax
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Python syntax
        run: python -m compileall -q agent install
      - name: Public unit suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s agent/tests -p 'test_*.py' -v

  debian13-python313:
    name: Debian 13 / Python 3.13 / isolated unit suite
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git bash python3 python3-paramiko
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - name: Record environment
        run: |
          cat /etc/os-release
          python3 --version
          git rev-parse HEAD
      - name: Shell syntax
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Python syntax
        run: python3 -m compileall -q agent install
      - name: Public unit suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s agent/tests -p 'test_*.py' -v
